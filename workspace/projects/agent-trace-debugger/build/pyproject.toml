[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracedbg"
version = "0.1.0"
description = "Record, replay, and diff multi-step agent executions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
demo = ["anthropic"]

[tool.setuptools.packages.find]
include = ["tracedbg*"]
